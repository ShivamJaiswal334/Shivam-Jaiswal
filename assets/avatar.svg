<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Illustrated avatar of a person with glasses and a beard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b35"/>
      <stop offset="1" stop-color="#15151c"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <clipPath id="circle"><circle cx="160" cy="160" r="160"/></clipPath>
  </defs>

  <g clip-path="url(#circle)">
    <!-- Background -->
    <rect width="320" height="320" fill="url(#bg)"/>
    <circle cx="160" cy="150" r="118" fill="rgba(255,255,255,0.08)"/>

    <!-- Shoulders / shirt -->
    <path d="M60 320 C60 258 104 232 160 232 C216 232 260 258 260 320 Z" fill="url(#shirt)"/>
    <path d="M160 232 L146 262 L160 300 L174 262 Z" fill="#0b1120"/>
    <!-- Collar -->
    <path d="M132 238 L160 262 L128 274 Z" fill="#334155"/>
    <path d="M188 238 L160 262 L192 274 Z" fill="#334155"/>

    <!-- Neck -->
    <rect x="142" y="206" width="36" height="40" rx="14" fill="#c68642"/>

    <!-- Head -->
    <circle cx="160" cy="150" r="66" fill="#d99a5b"/>
    <!-- Ears -->
    <circle cx="96" cy="152" r="12" fill="#d99a5b"/>
    <circle cx="224" cy="152" r="12" fill="#d99a5b"/>

    <!-- Hair -->
    <path d="M96 140 C92 92 128 72 160 72 C192 72 228 92 224 140 C224 118 206 104 190 102 C196 110 196 118 196 118 C180 104 150 102 134 110 C128 112 120 120 118 132 C110 128 100 132 96 140 Z" fill="url(#hair)"/>

    <!-- Beard -->
    <path d="M104 150 C104 150 108 212 160 222 C212 212 216 150 216 150 C214 178 198 196 160 196 C122 196 106 178 104 150 Z" fill="url(#hair)"/>
    <!-- Moustache -->
    <path d="M138 170 C148 176 172 176 182 170 C176 180 144 180 138 170 Z" fill="url(#hair)"/>

    <!-- Eyebrows -->
    <rect x="124" y="134" width="30" height="6" rx="3" fill="#1f1f27"/>
    <rect x="166" y="134" width="30" height="6" rx="3" fill="#1f1f27"/>

    <!-- Eyes -->
    <circle cx="139" cy="150" r="6" fill="#1f2937"/>
    <circle cx="181" cy="150" r="6" fill="#1f2937"/>

    <!-- Glasses -->
    <g fill="none" stroke="#0f172a" stroke-width="5">
      <rect x="118" y="138" width="42" height="30" rx="10"/>
      <rect x="160" y="138" width="42" height="30" rx="10"/>
      <path d="M160 150 h0"/>
      <path d="M160 150 c-2 -4 2 -4 0 0"/>
      <path d="M160 152 h0"/>
    </g>
    <path d="M160 150 h0" />
    <line x1="160" y1="150" x2="160" y2="150" stroke="#0f172a" stroke-width="5"/>
    <path d="M160 151 h0"/>
    <line x1="158" y1="150" x2="162" y2="150" stroke="#0f172a" stroke-width="5"/>
    <line x1="96" y1="146" x2="118" y2="150" stroke="#0f172a" stroke-width="5"/>
    <line x1="224" y1="146" x2="202" y2="150" stroke="#0f172a" stroke-width="5"/>

    <!-- Nose -->
    <path d="M160 154 L154 172 C156 176 164 176 166 172 Z" fill="#c68642"/>
  </g>
</svg>
